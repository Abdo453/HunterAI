version: '3.9'

services:
  pentestai:
    build: .
    container_name: pentestai-unified
    ports:
      - "7070:7070"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
