server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://spring:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /php/ {
        proxy_pass http://php:80/;
    }

    location /java/ {
        proxy_pass http://springjava:8080/;
    }

    location /trade/ {
        proxy_pass http://cointransfer:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://spring:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
