# ============================================================
# PentestAI Unified - الإعدادات العامة
# ============================================================

server:
  host: "127.0.0.1"
  port: 7070
  debug: false

storage:
  sessions_dir: "data/sessions"
  reports_dir: "data/reports"
  wordlists_dir: "data/wordlists"

logging:
  level: "INFO"
  file: "data/pentestai.log"

scan:
  default_timeout: 300
  max_parallel_tools: 5

report:
  formats: ["json", "html"]
  include_raw_output: true
  cvss_version: "3.1"

# ملاحظة حوكمة: هذا القسم غير مقروء حاليًا في الكود (لا يوجد قارئ لـ settings.yaml).
# القيم أدناه fail-closed صراحةً لتفادي أي "فتح افتراضي" إذا وُصل لاحقًا ببوابة حقيقية.
# أي تفعيل فعلي يجب أن يمرّ عبر PolicyGate/ScopeEngine وليس عبر إعداد ثابت هنا.
permissions:
  autonomous_full_permissions: false
  auto_approve_all: false
  allow_active_probing: false
  allow_elevated_sudo: false
  unrestricted_scope: false

