# ============================================================
# PentestAI Unified - إعدادات الموديلات
# ============================================================

# الموديلات المحلية عبر Ollama
local_models:
  qwen_coder:
    model: "qwen2.5-coder:14b"
    host: "http://localhost:11434"
    role: "exploit_developer"
    description: "متخصص كتابة الـ exploits وتحليل الكود"
    temperature: 0.2
    enabled: true

  pentester:
    model: "xploiter/pentester:latest"
    host: "http://localhost:11434"
    role: "pentest_strategist"
    description: "خبير استراتيجية اختبار الاختراق"
    temperature: 0.4
    enabled: true

  whiterabbitneo:
    model: "WhiteRabbitNeo/Llama-3.1-WhiteRabbitNeo-2-8B:latest"
    host: "http://localhost:11434"
    role: "offensive_security"
    description: "متخصص في الـ offensive security والـ red team"
    temperature: 0.3
    enabled: true

# الموديلات عبر API (تحتاج API keys في .env)
api_models:
  openai:
    env_key: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "o1-mini", "o3-mini"]
    enabled: false

  anthropic:
    env_key: "ANTHROPIC_API_KEY"
    models: ["claude-3-5-sonnet-20241022", "claude-3-opus-20240229"]
    enabled: false

  gemini:
    env_key: "GEMINI_API_KEY"
    models: ["gemini-2.0-flash", "gemini-1.5-pro"]
    enabled: false

  groq:
    env_key: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    models: ["llama-3.3-70b-versatile", "mixtral-8x7b-32768"]
    enabled: false

  deepseek:
    env_key: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    models: ["deepseek-chat", "deepseek-reasoner"]
    enabled: false

  openrouter:
    env_key: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    models: ["any"]
    enabled: false

  nvidia_nim:
    env_key: "NVIDIA_API_KEY"
    base_url: "https://integrate.api.nvidia.com/v1"
    models: ["nvidia/llama-3.1-nemotron-70b-instruct"]
    enabled: false

# إعدادات Model Council
council:
  rounds: 3
  timeout: 120
  parallel: true
  min_models: 2
