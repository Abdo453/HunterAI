# ==============================================================================
# HunterAI Canonical Tool & MCP Catalog (Single Source of Truth)
# ==============================================================================
# Synchronize derived manifests (`config/tools.json`, `config/tools.yaml`,
# `tools_mcp.json`) via:
#     python scripts/sync_tool_manifests.py --write
# Validate parity in CI via:
#     python scripts/sync_tool_manifests.py --check
# ==============================================================================
version: "1.0.0"
schema: "hunterai-tools-catalog/1"
description: >-
  Tool and MCP surface available to the root controller tree. Every entry is
  bound by the policy engine before execution; nothing here runs without a
  signed grant and an in-scope target.

browser:
  burpsuite_proxy: "127.0.0.1:8080"
  zap_proxy: "127.0.0.1:8090"
  use_proxy: false
  headless: true

tiers:
  recon:
    risk: low
    requires_authorization: false
    action_class: read_only
    tools: [subfinder, assetfinder, dnsx, httpx, whatweb, katana, gau, browser]
  network_scan:
    risk: medium
    requires_authorization: true
    action_class: active_test
    tools: [nmap, naabu, masscan, enum4linux-ng, netexec, ssh-audit]
  web_active:
    risk: medium
    requires_authorization: true
    action_class: active_test
    tools: [ffuf, arjun, paramspider, dalfox, nikto, wpscan, wafw00f]
  vuln_scanning:
    risk: high
    requires_authorization: true
    action_class: active_test
    tools: [nuclei]
  exploit_proof:
    risk: high
    requires_authorization: true
    action_class: exploit_proof
    tools: [sqlmap]
  tls:
    risk: medium
    requires_authorization: true
    action_class: active_test
    tools: [testssl.sh, sslscan]
  proxy_orchestration:
    risk: medium
    requires_authorization: true
    action_class: active_test
    tools: [burp_scanner]
  wireless:
    risk: high
    requires_authorization: true
    action_class: active_test
    tools: [kismet, aircrack-ng, wifite]
  ot_iot:
    risk: high
    requires_authorization: true
    action_class: active_test
    tools: [modbus-cli, zigbee2mqtt]
  credential_review:
    risk: high
    requires_authorization: true
    action_class: active_test
    tools: [hydra, medusa, john, hashcat]
    constraints:
      - operator-provided wordlists only
      - operator-provided accounts only
      - rate limited, no spraying across unrelated hosts
      - credential_dump invariant still applies to password stores and hashes at scale
  reverse_engineering:
    risk: low
    requires_authorization: false
    action_class: read_only
    tools: [radare2, gdb, binwalk, checksec, strings, file]
  cloud_posture:
    risk: medium
    requires_authorization: true
    action_class: read_only
    tools: [prowler, trivy, kube_hunter, checkov]
  osint:
    risk: low
    requires_authorization: false
    action_class: read_only
    tools: [sherlock, recon-ng, spiderfoot, theharvester, shodan]

tools:
  # ── Core Security / Recon / Web / Network Tools (in config/tools.json) ──────
  - id: burp_scanner
    name: burp_scanner
    executable: burp
    type: security
    category: vuln
    tier: proxy_orchestration
    risk: medium
    permissions: [recon, scan, active_testing]
    purpose: Burp Suite automated scanner integration for vulnerability discovery
    requires_authorization: true
    timeout_s: 300
    scope_relevant: true
    in_tools_json: true
    command_template: "burp --scan {target}"

  - id: subfinder
    name: subfinder
    executable: subfinder
    type: recon
    category: dns
    yaml_group: recon
    yaml_key: subfinder
    yaml_args: ""
    tier: recon
    risk: low
    permissions: [recon]
    purpose: Passive subdomain enumeration via multiple public sources
    requires_authorization: false
    timeout_s: 120
    scope_relevant: true
    in_tools_json: true
    command_template: "subfinder -d {target} -silent -json"

  - id: assetfinder
    name: assetfinder
    executable: assetfinder
    type: recon
    category: dns
    yaml_group: recon
    yaml_key: assetfinder
    yaml_args: ""
    tier: recon
    risk: low
    permissions: [recon]
    purpose: Fast asset and subdomain discovery using public archives
    requires_authorization: false
    timeout_s: 60
    scope_relevant: true
    in_tools_json: true
    command_template: "assetfinder --subs-only {target}"

  - id: dnsx
    name: dnsx
    executable: dnsx
    type: recon
    category: dns
    tier: recon
    risk: low
    permissions: [recon]
    purpose: High-throughput DNS query, resolution, and brute-forcer
    requires_authorization: false
    timeout_s: 120
    scope_relevant: true
    in_tools_json: true
    command_template: "dnsx -l {input_file} -silent -json"

  - id: httpx
    name: httpx
    executable: httpx
    type: recon
    category: http
    yaml_group: web
    yaml_key: httpx
    yaml_args: ""
    tier: recon
    risk: low
    permissions: [recon]
    purpose: Fast HTTP probing, status code checking, and tech detection
    requires_authorization: false
    timeout_s: 60
    scope_relevant: true
    in_tools_json: true
    command_template: "httpx -l {input_file} -silent -json -tech-detect"

  - id: nmap
    name: nmap
    executable: nmap
    type: scanner
    category: ports
    yaml_group: network
    yaml_key: nmap
    yaml_args: "-sV -sC"
    tier: network_scan
    risk: medium
    permissions: [recon, scan]
    purpose: Network port scanning, OS detection, and service fingerprinter
    requires_authorization: false
    timeout_s: 300
    scope_relevant: true
    in_tools_json: true
    command_template: "nmap -sV -T3 -Pn --top-ports 100 {target}"

  - id: naabu
    name: naabu
    executable: naabu
    type: scanner
    category: ports
    tier: network_scan
    risk: medium
    permissions: [recon, scan]
    purpose: Fast SYN/CONNECT port scanner focused on reliability
    requires_authorization: false
    timeout_s: 180
    scope_relevant: true
    in_tools_json: true
    command_template: "naabu -host {target} -silent"

  - id: masscan
    name: masscan
    executable: masscan
    type: scanner
    category: ports
    yaml_group: network
    yaml_key: masscan
    yaml_args: "--rate 1000"
    tier: network_scan
    risk: medium
    permissions: [recon, scan]
    purpose: Ultra-fast asynchronous port discovery feeding the network pipeline discovery stage
    requires_authorization: true
    timeout_s: 120
    scope_relevant: true
    in_tools_json: true
    command_template: "masscan -p{ports} --rate {rate} -oJ {output}"

  - id: netexec
    name: netexec
    executable: netexec
    type: scanner
    category: ad
    yaml_group: network
    yaml_key: netexec
    yaml_args: ""
    tier: network_scan
    risk: high
    permissions: [recon, scan, active_testing]
    purpose: Active Directory / SMB / LDAP / WinRM enumeration and credential validation
    requires_authorization: true
    timeout_s: 120
    scope_relevant: true
    in_tools_json: true
    command_template: "netexec {protocol} {target} {args}"

  - id: enum4linux-ng
    name: enum4linux-ng
    executable: enum4linux-ng
    type: recon
    category: ad
    yaml_group: network
    yaml_key: enum4linux
    yaml_args: "-A"
    tier: network_scan
    risk: medium
    permissions: [recon, scan]
    purpose: SMB/RPC/AD enumeration (users, shares, groups, password policy)
    requires_authorization: true
    timeout_s: 180
    scope_relevant: true
    in_tools_json: true
    command_template: "enum4linux-ng -A -oJ {output} {target}"

  - id: katana
    name: katana
    executable: katana
    type: crawler
    category: crawling
    yaml_group: web
    yaml_key: katana
    yaml_args: ""
    tier: recon
    risk: low
    permissions: [recon, crawling]
    purpose: Modern web crawler and endpoint spider supporting headless browser mode
    requires_authorization: false
    timeout_s: 120
    scope_relevant: true
    in_tools_json: true
    command_template: "katana -u {target} -silent -json"

  - id: gau
    name: gau
    executable: gau
    type: crawler
    category: crawling
    yaml_group: web
    yaml_key: gau
    yaml_args: ""
    tier: recon
    risk: low
