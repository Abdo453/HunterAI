    timeout_s: 120
    scope_relevant: true
    in_tools_json: true
    command_template: "gau {target} --subs"

  - id: ffuf
    name: ffuf
    executable: ffuf
    type: fuzzer
    category: fuzzing
    yaml_group: web
    yaml_key: ffuf
    yaml_args: ""
    tier: web_active
    risk: medium
    permissions: [fuzzing, active_testing]
    purpose: Fast web fuzzer for directory, endpoint, and parameter discovery
    requires_authorization: false
    timeout_s: 300
    scope_relevant: true
    in_tools_json: true
    command_template: "ffuf -u {target}/FUZZ -w {wordlist} -of json -s"

  - id: nuclei
    name: nuclei
    executable: nuclei
    type: security
    category: vuln
    yaml_group: web
    yaml_key: nuclei
    yaml_args: ""
    tier: vuln_scanning
    risk: high
    permissions: [scan, active_testing]
    purpose: Vulnerability scanner powered by community YAML templates
    requires_authorization: true
    timeout_s: 600
    scope_relevant: true
    in_tools_json: true
    command_template: "nuclei -l {input_file} -silent -jsonl"

  - id: sqlmap
    name: sqlmap
    executable: sqlmap
    type: security
    category: vuln
    yaml_group: web
    yaml_key: sqlmap
    yaml_args: "--batch"
    tier: exploit_proof
    risk: high
    permissions: [active_testing, exploit_verify]
