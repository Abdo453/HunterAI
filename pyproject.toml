[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterai"
version = "2.5.0"
description = "HunterAI (PentestAI-Unified) — محرك اختبار اختراق ذاتي الإثبات بواجهة وكلاء متعددين"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "HunterAI Contributors" }]
keywords = ["pentest", "security", "ai", "agents", "ctf", "bug-bounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

# الاعتماديات الأساسية (القائمة الكاملة في requirements.lock)
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "requests>=2.31",
    "rich>=13.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "ollama>=0.4",
    "openai>=1.30",
    "anthropic>=0.30",
    "psutil>=5.9",
]

[project.optional-dependencies]
tui = ["textual>=0.50"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
hunter = "cli.hunter_cli:main"
hunterai = "main:main"

[project.urls]
Homepage = "https://github.com/your-org/PentestAI-Unified"
Issues = "https://github.com/your-org/PentestAI-Unified/issues"

[tool.setuptools.packages.find]
include = [
    "core*",
    "engines*",
    "flags*",
    "ctf*",
    "agents*",
    "hunter_ai*",
    "tools*",
    "models*",
    "orchestrator*",
    "ui*",
    "cli*",
    "skills*",
]
exclude = ["tests*", "data*", "artifacts*", "reports*", "logs*", "benchmarks*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: اختبارات بطيئة أو تتطلب شبكة",
    "integration: اختبارات تكامل حقيقية",
]
# لعزل state leakage بين ملفات الاختبار: python -m pytest tests/ -n 4 -p xdist

