# HunterAI — CI / Epistemic Regression Pipeline (Phase 8)
# دمج الـ workflow القديم (السويت + جلسات التحقق الإبستمي) مع إضافات المرحلة 8:
# السويت offline مع استثناءات صريحة + بوابة الجاهزية كدخان واقعي على كل runner.
# tests/v27 و tests/integration تحتاج بيئة خارجية/شبكة — مستثناة صراحة.
name: CI / Epistemic Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite & Epistemic Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run Core Test Suite
        run: |
          python -m pytest tests/ -q -m "not slow" \
            --ignore=tests/benchmarks --ignore=tests/v27 --ignore=tests/integration \
            -p no:cacheprovider

      - name: Run Physical Wire Epistemic Live Session
        run: |
          python run_unified_live_session.py

      - name: Run Epistemic Specification Suite
        run: |
          python run_causal_validation_arena.py

      - name: Readiness Gate Smoke
        run: |
          python -m core.readiness --timeout 5 --output ci_readiness_report.json
          python -c "import json; r=json.load(open('ci_readiness_report.json')); print('strict_ready:', r['strict_ready'], '| counts:', r['counts'])"
