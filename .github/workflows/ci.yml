name: CI / Epistemic Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite & Epistemic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Core Test Suite
        run: |
          python -m pytest tests/ -v -m "not slow" --ignore=tests/benchmarks

      - name: Run Physical Wire Epistemic Live Session
        run: |
          python run_unified_live_session.py

      - name: Run Epistemic Specification Suite
        run: |
          python run_causal_validation_arena.py
