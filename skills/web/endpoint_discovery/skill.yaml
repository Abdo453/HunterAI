name: endpoint_discovery
category: web
description: "Discover hidden endpoints and directories using ffuf, gobuster, or dirsearch"
version: "1.0"
input:
  - live_hosts.txt
  - target_domain: str
output:
  - endpoints.txt
  - interesting_endpoints.txt
depends_on:
  - live_host_detection
next_skills:
  - parameter_discovery
  - xss
  - sqli
  - idor
fallback_skills:
  - api_surface_audit
tools_required:
  - ffuf
fallback_tools:
  - gobuster
  - dirsearch
timeout_seconds: 240
max_retries: 2
enabled: true
