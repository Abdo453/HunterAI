name: spa_api_extractor
class: SPAAPIExtractorSkill
category: browser
description: "Full SPA navigation with AI browser - discovers all hidden API endpoints not visible to static crawlers"
version: "1.0"
input:
  - target: str
  - auth_context: dict
output:
  - spa_endpoints.json
  - spa_api_map.md
depends_on: [browser_recon, auth_session_extractor]
next_skills: [burp_traffic_analyzer, endpoint_discovery]
fallback_skills: [endpoint_discovery]
tools_required: []
timeout_seconds: 120
max_retries: 1
enabled: true
