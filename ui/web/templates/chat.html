<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PentestAI · Co-Pilot</title>
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">✳</span>
        <span class="brand-name">PentestAI</span>
      </div>

      <button class="new-chat" id="newChat">
        <span>＋</span> New chat
      </button>

      <nav class="convs" id="convs" aria-label="Conversations"></nav>

      <div class="sidebar-foot">
        <label class="lbl" for="modelSelect">Model</label>
        <select id="modelSelect" class="model-select">
          <option value="auto">Auto (smart router)</option>
        </select>
        <div class="hint" id="modelHint"></div>

        <div class="status-row">
          <span class="dot" id="connDot"></span>
          <span id="connText">connecting…</span>
        </div>
        <div class="policy" id="policyTag">policy: —</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menuBtn" aria-label="Toggle sidebar">☰</button>
        <div class="title">Security Co-Pilot</div>
        <button class="icon-btn" id="clearBtn" title="Clear this conversation">⟲</button>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message PentestAI…  (Shift+Enter for newline)"></textarea>
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 12l15-7-7 15-2-6-6-2z" fill="currentColor"/>
          </svg>
        </button>
      </form>
      <div class="foot-note">الأدلة تُحدَّد بالمحكمة · لا finding مؤكَّد بلا إثبات تنفيذ</div>
    </main>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
